/* grabs the pack list again without redrawing the page */
function refreshPacks(){
  return Promise.all([
    fetch('packs.json',{cache:'no-cache'}).then(r=>r.json()),
    fetch('/api/packs',{cache:'no-store'}).then(r=>r.ok?r.json():[]).catch(()=>[])
  ]).then(([a,b])=>{packs=a.concat(b)}).catch(()=>{});
}
const kb=n=>n<1048576?Math.max(1,Math.round(n/1024))+' KB':(n/1048576).toFixed(1)+' MB';
// turns a pack card into the edit form (text, icon, screenshots, files)
// used on the account page and the moderation page. opts: {mod, onSaved(d, backInQueue), onCancel()}
function showEdit(p,card,opts){
  const name=el('input',{type:'text',maxlength:'40',value:p.name,'aria-label':'Pack name'});
  const desc=el('textarea',{maxlength:'500','aria-label':'Description'});desc.value=p.description||'';
  const tags=el('input',{type:'text',maxlength:'200',value:(p.tags||[]).join(', '),'aria-label':'Tags, separated by commas'});
  const emsg=el('p',{class:'msg',role:'status'});
  const save=el('button',{class:'btn',type:'button',text:'Save changes'});
  const cancel=el('button',{class:'btn',type:'button',text:'Cancel'});
  cancel.addEventListener('click',opts.onCancel);

  const icon=el('input',{type:'file',accept:IMG_OK,'aria-label':'New icon'});
  const shotRows=[1,2,3,4].map(i=>{
    const n='shot'+i;
    return {n,i,has:(p.images||[]).includes(n),input:el('input',{type:'file',accept:IMG_OK,'aria-label':'Screenshot '+i}),rm:el('input',{type:'checkbox'})};
  });
  const skinsIn=el('input',{type:'file',accept:'.pck','aria-label':'New skins.pck'});
  const skinsInfo=el('p',{class:'hint'});
  skinsIn.addEventListener('change',()=>checkPckInput(skinsIn,skinsInfo));
  const skinsRm=el('input',{type:'checkbox'});
  const fileRows=PLATFORMS.map(([k,n])=>({
    k,n,cur:(p.files||[]).find(f=>f.pkey===k),input:el('input',{type:'file','aria-label':n+' file'}),rm:el('input',{type:'checkbox'})
  }));

  save.addEventListener('click',async()=>{
    emsg.className='msg';emsg.textContent='';
    const bad=t=>{emsg.className='msg err';emsg.textContent=t};
    if(name.value.trim().length<3)return bad('Pack name must be at least 3 characters.');
    const fd=new FormData();
    fd.append('id',p.id);fd.append('name',name.value);fd.append('description',desc.value);fd.append('tags',tags.value);
    if(icon.files[0]){
      if(icon.files[0].size>MAXB.icon)return bad('The icon is too big (max 512 KB).');
      fd.append('icon',icon.files[0]);
    }
    for(const r of shotRows){
      const f=r.input.files[0];
      if(f){if(f.size>MAXB.shot)return bad('Screenshot '+r.i+' is too big (max 2 MB).');fd.append(r.n,f)}
      else if(r.has&&r.rm.checked)fd.append('remove_'+r.n,'1');
    }
    const sk=skinsIn.files[0];
    if(sk){
      if(sk.size>MAXB.skins)return bad('The skins.pck is too big (max 3 MB).');
      fd.append('skins',sk);
    }else if(p.hasSkins&&skinsRm.checked)fd.append('remove_skins','1');
    let kept=(p.files||[]).length;
    for(const r of fileRows){
      const f=r.input.files[0];
      if(f){
        if(f.size>MAXB.pack)return bad('The '+r.n+' file is too big (max 5 MB).');
        fd.append('file_'+r.k,f);if(!r.cur)kept++;
      }else if(r.cur&&r.rm.checked){fd.append('remove_file_'+r.k,'1');kept--}
    }
    if(kept<1)return bad('A pack needs at least one pack file.');
    save.disabled=true;emsg.textContent='Saving... please wait.';
    try{
      const r=await fetch('/api/my/edit',{method:'POST',body:fd});
      const d=await r.json().catch(()=>({}));
      if(r.ok&&d.ok){
        const backInQueue=d.status==='pending'&&p.status!=='pending';
        refreshPacks();   // update the gallery too
        opts.onSaved(d,backInQueue);return;
      }
      bad(d.error||'That did not work.');
    }catch{bad('Network problem. Try again.')}
    save.disabled=false;
  });

  card.textContent='';
  add(card,
    el('h3',{text:'Edit pack'}),
    opts.mod?el('p',{class:'hint',text:'Moderator edit: your changes go live right away and the pack keeps its status.'}):null,
    !opts.mod&&p.status==='denied'?el('p',{class:'hint',text:'This pack was denied. Saving sends it back to Pending for another review.'}):null,
    !opts.mod&&p.status==='approved'?el('p',{class:'hint',text:'Changing the name, description or tags keeps your pack live. Changing the icon, screenshots or files sends it back to Pending until a moderator approves it again.'}):null,
    el('label',{text:'Pack name'}),name,
    el('label',{text:'Description (optional)'}),desc,
    el('label',{text:'Tags, separated by commas (up to 5)'}),tags,
    el('hr',{class:'sep'}),
    el('label',{text:'Icon'}),
    el('img',{src:'/files/'+p.id+'/icon',alt:'Current icon',class:'icon'}),
    el('p',{class:'hint',text:'Choose a file only if you want to replace it. PNG, JPG or WebP, up to 512 KB.'}),icon,
    el('h3',{text:'Screenshots'}),
    el('p',{class:'hint',text:'Up to 4 images. A new file replaces the one in that slot. PNG, JPG or WebP, up to 2 MB each.'}));
  shotRows.forEach(r=>add(card,
    el('label',{text:'Screenshot '+r.i+(r.has?' (one is uploaded)':' (empty)')}),r.input,
    r.has?el('label',{class:'chk'},r.rm,el('span',{text:'Remove this screenshot'})):null));
  if(p.type!=='texture')add(card,
    el('h3',{text:'3D skin preview'}),
    el('p',{class:'hint',text:p.hasSkins?'A skins.pck is uploaded. Choose a file only to replace it (up to 3 MB).':'Add the skins.pck from your pack (up to 3 MB) to get a 3D skin carousel on the pack page.'}),
    skinsIn,skinsInfo,
    p.hasSkins?el('label',{class:'chk'},skinsRm,el('span',{text:'Remove the skin preview'})):null);
  add(card,
    el('h3',{text:'Pack files'}),
    el('p',{class:'hint',text:'A new file replaces the current one for that platform, up to 5 MB each. You must keep at least one.'}));
  fileRows.forEach(r=>add(card,
    el('label',{text:r.n+(r.cur?' (current: '+r.cur.filename+', '+kb(r.cur.size)+')':' (none)')}),r.input,
    r.cur?el('label',{class:'chk'},r.rm,el('span',{text:'Remove this file'})):null));
  add(card,emsg,el('div',{class:'dl'},save,cancel));
}

/* ---------- change your own password (shows on the account page) ---------- */
function passwordBox(){
  const box=el('div',{class:'reportbox'});
  const toggle=el('button',{class:'btn',type:'button',text:'Change password'});
  const form=el('div',{hidden:''});
  const cur=el('input',{type:'password',maxlength:'128',autocomplete:'current-password','aria-label':'Current password'});
  const n1=el('input',{type:'password',maxlength:'128',autocomplete:'new-password','aria-label':'New password'});
  const n2=el('input',{type:'password',maxlength:'128',autocomplete:'new-password','aria-label':'Repeat new password'});
  const save=el('button',{class:'btn',type:'button',text:'Save new password'});
  const msg=el('p',{class:'msg',role:'status'});
  const say=(t,ok)=>{msg.className='msg '+(ok?'ok':'err');msg.textContent=t};
  form.append(
    el('p',{class:'hint',text:'At least 10 characters. Your other devices get logged out.'}),
    el('label',{text:'Current password'}),cur,
    el('label',{text:'New password'}),n1,
    el('label',{text:'Repeat new password'}),n2,
    el('div',{class:'dl'},save),msg);
  box.append(toggle,form);
  toggle.addEventListener('click',()=>{form.hidden=!form.hidden;msg.textContent=''});
  async function go(){
    msg.className='msg';msg.textContent='';
    if(!cur.value||!n1.value)return say('Fill in all three boxes.');
    if(n1.value!==n2.value)return say('The two new passwords do not match.');
    save.disabled=true;msg.textContent='One moment...';
    try{
      const r=await fetch('/api/password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({current:cur.value,next:n1.value})});
      const d=await r.json().catch(()=>({}));
      if(r.ok&&d.ok){cur.value=n1.value=n2.value='';say('Password changed.',true)}
      else say(d.error||'That did not work.');
    }catch{say('Network problem. Try again.')}
    save.disabled=false;
  }
  save.addEventListener('click',go);
  [cur,n1,n2].forEach(i=>i.addEventListener('keydown',e=>{if(e.key==='Enter')go()}));
  return box;
}

/* ---------- account page (#/account) ----------
   my packs, their status, edit and delete buttons */
function showAccount(){
  const a=$('account');a.textContent='';document.title='My account | Skin Central';
  a.append(el('h2',{text:'My account'}));
  meP.then(me=>{
    if(!me.loggedIn){
      const liBtn=el('button',{class:'btn',type:'button',text:'Log in'});
      liBtn.addEventListener('click',()=>showAuth('login'));
      a.append(el('p',{text:'Log in to see your account.'}),liBtn);
      return;
    }
    const list=el('div',{text:'Loading...'});
    const msg=el('p',{class:'msg',role:'status'});
    a.append(
      el('p',{class:'hint',text:'Logged in as '+me.user.name+(me.role==='owner'?' (owner)':me.role==='admin'?' (admin)':me.isMod?' (moderator)':'')+'.'}),
      el('div',{class:'dl'},el('a',{class:'btn',href:'#/user/'+encodeURIComponent(me.user.name),text:'My profile'}),el('a',{class:'btn',href:'#/upload',text:'Upload a pack'})),
      passwordBox(),
      el('h3',{text:'My packs'}),msg,list);

    async function remove(p){
      msg.className='msg';msg.textContent='Deleting...';
      try{
        const r=await fetch('/api/my/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:p.id})});
        const d=await r.json().catch(()=>({}));
        if(r.ok&&d.ok){
          refreshPacks();   // gone from the gallery too
          msg.className='msg ok';msg.textContent='Deleted "'+p.name+'".';load();
        }else{msg.className='msg err';msg.textContent=d.error||'That did not work.'}
      }catch{msg.className='msg err';msg.textContent='Network problem. Try again.'}
    }
    function load(){
      fetch('/api/my',{cache:'no-store'}).then(r=>r.ok?r.json():Promise.reject()).then(items=>{
        list.textContent='';
        if(!items.length){list.appendChild(el('p',{class:'empty',text:'You have not uploaded any packs yet.'}));return}
        items.forEach(p=>{
          const card=el('div',{class:'card admin'});
          const edit=el('button',{class:'btn',type:'button',text:'Edit'});
          edit.addEventListener('click',()=>{msg.textContent='';showEdit(p,card,{
            onCancel:load,
            onSaved:(d,back)=>{msg.className='msg ok';msg.textContent=back?'Saved. Your pack is back in the queue for review.':'Saved.';load()}
          })});
          const del=el('button',{class:'btn',type:'button',text:'Delete'});
          del.addEventListener('click',()=>askConfirm('Delete this pack?',
            '"'+p.name+'" and all of its files will be deleted for good. This cannot be undone.',
            'Yes, delete it',()=>remove(p)));
          add(card,
            el('h3',{text:p.name}),
            el('p',{class:'by',text:'Status: '+p.status[0].toUpperCase()+p.status.slice(1)+'. Uploaded '+new Date(p.created_at*1000).toLocaleDateString()+'.'}),
            p.deny_reason?el('p',{class:'by',text:'Reason: '+p.deny_reason}):null,
            el('div',{class:'dl'},edit,del));
          list.appendChild(card);
        });
      }).catch(()=>{list.textContent='Could not load your packs.'});
    }
    load();
  });
}

/* ---------- profile pages (#/user/<username>) ----------
   picture, display name, bio, join date and that persons approved packs */
const AVATAR_MAX=256*1024;  // same as LIMITS.avatar in src/index.js
function bigAvatar(u,cls){
  const letter=()=>el('div',{class:'avatar ph '+(cls||''),text:(u.displayName||u.username).charAt(0).toUpperCase()});
  if(!u.hasAvatar)return letter();
  const im=el('img',{class:'avatar '+(cls||''),src:'/files/avatar/'+u.username.toLowerCase()+'?v='+(u.avatarV||0),alt:''});
  im.addEventListener('error',()=>im.replaceWith(letter()));
  return im;
}
function showProfile(name){
  const pr=$('profile');pr.textContent='';document.title=name+' | Skin Central';
  pr.append(el('p',{class:'hint',text:'Loading...'}));
  Promise.all([
    fetch('/api/user?name='+encodeURIComponent(name),{cache:'no-store'}).then(async r=>({ok:r.ok,d:await r.json().catch(()=>({}))})).catch(()=>({ok:false,d:{error:'Network problem. Try again.'}})),
    meP
  ]).then(([r,me])=>{
    pr.textContent='';
    if(!r.ok){
      pr.append(el('h2',{text:'Profile not found'}),el('p',{text:r.d.error||'No one has that name.'}),el('a',{class:'btn',href:'#skins',text:'Browse packs'}));
      return;
    }
    const u=r.d;
    document.title=(u.displayName||u.username)+' | Skin Central';
    const mine=me.loggedIn&&me.user.name.toLowerCase()===u.username.toLowerCase();
    const role=u.role==='owner'?'Owner':u.role==='admin'?'Admin':u.role==='mod'?'Moderator':'';
    const edit=mine?el('button',{class:'btn',type:'button',text:'Edit profile'}):null;
    if(edit)edit.addEventListener('click',()=>showEditProfile(u));
    // add() skips nulls, plain append() would print the word "null" for empty bios
    add(pr,
      el('div',{class:'head'},bigAvatar(u),el('div',{},
        el('h2',{text:u.displayName||u.username}),
        u.displayName?el('p',{class:'by',text:'@'+u.username}):null,
        role?el('p',{class:'by',text:role}):null,
        el('p',{class:'by',text:'Joined '+u.joined}))),
      u.bio?el('p',{class:'bio',text:u.bio}):null,
      edit?el('div',{class:'dl'},edit):null);
    const mineP=packs.filter(p=>p.creatorUsername&&p.creatorUsername.toLowerCase()===u.username.toLowerCase());
    const grid=el('div',{class:'grid'});
    if(!mineP.length)grid.append(el('p',{class:'empty',text:'No approved packs yet.'}));
    mineP.forEach(p=>grid.append(packCard(p)));
    pr.append(el('h3',{text:'Packs by '+(u.displayName||u.username)+' ('+mineP.length+')'}),grid);
  });
}
/* edit profile popup, saves to /api/profile then reloads so the new picture shows everywhere */
function showEditProfile(u){
  const esc=e=>{if(e.key==='Escape')close()};
  const close=()=>{ov.remove();document.removeEventListener('keydown',esc)};
  const name=el('input',{type:'text',maxlength:'24',placeholder:u.username,'aria-label':'Display name',autocomplete:'off'});
  name.value=u.displayName||'';
  const bio=el('textarea',{maxlength:'200','aria-label':'Bio'});
  bio.value=u.bio||'';
  const count=el('p',{class:'hint'});
  const paint=()=>{count.textContent=bio.value.length+' / 200'};
  bio.addEventListener('input',paint);paint();
  const pv=el('div',{},bigAvatar(u,'sm'));
  const file=el('input',{type:'file',accept:IMG_OK,'aria-label':'Profile picture'});
  const rm=el('input',{type:'checkbox',id:'pf-rm'});
  const msg=el('p',{class:'msg',role:'status'});
  const save=el('button',{class:'btn',type:'button',text:'Save'});
  const no=el('button',{class:'btn',type:'button',text:'Cancel'});
  const err=t=>{msg.className='msg err';msg.textContent=t};
  file.addEventListener('change',()=>{
    msg.textContent='';
    const f=file.files[0];
    if(!f)return;
    if(!['image/png','image/jpeg','image/webp'].includes(f.type)){err('Pictures must be PNG, JPG or WebP.');file.value='';return}
    if(f.size>AVATAR_MAX){err('That picture is too big. Max '+kb(AVATAR_MAX)+'.');file.value='';return}
    pv.textContent='';pv.append(el('img',{class:'avatar sm',src:URL.createObjectURL(f),alt:''}));
    rm.checked=false;
  });
  save.addEventListener('click',async()=>{
    msg.className='msg';msg.textContent='';
    const f=file.files[0];
    const fd=new FormData();
    fd.append('displayName',name.value.trim());
    fd.append('bio',bio.value.trim());
    if(f)fd.append('avatar',f);else if(rm.checked)fd.append('removeAvatar','1');
    save.disabled=true;
    try{
      const r=await fetch('/api/profile',{method:'POST',body:fd});
      const d=await r.json().catch(()=>({}));
      if(r.ok&&d.ok){close();location.reload();return}
      err(d.error||'That did not work.');
    }catch{err('Network problem. Try again.')}
    save.disabled=false;
  });
  no.addEventListener('click',close);
  const ov=el('div',{class:'modal'},
    el('div',{class:'panel',role:'dialog','aria-modal':'true','aria-labelledby':'pf-title'},
      el('h2',{id:'pf-title',text:'Edit profile'}),
      el('label',{text:'Display name (optional)'}),name,
      el('p',{class:'hint',text:'Your username stays @'+u.username+'. Packs you upload still show your username.'}),
      el('label',{text:'Bio'}),bio,count,
      el('label',{text:'Profile picture (PNG, JPG or WebP, '+kb(AVATAR_MAX)+' max)'}),pv,file,
      u.hasAvatar?el('label',{class:'chk',for:'pf-rm'},rm,el('span',{text:'Remove my picture'})):null,
      msg,
      el('div',{class:'dl'},save,no)));
  ov.addEventListener('click',e=>{if(e.target===ov)close()});
  document.addEventListener('keydown',esc);
  document.body.append(ov);
  name.focus();
}

function route(){
  const h=location.hash;
  if(carouselStop)carouselStop();
  if(h==='#textures')packType='texture';else if(h===''||h==='#skins')packType='skin';
  const m=h.match(/^#\/pack\/(.+)$/);
  const p=m&&packs.find(x=>x.slug===decodeURIComponent(m[1]));
  const us=h.match(/^#\/user\/([A-Za-z0-9_]{3,20})$/);
  const up=h==='#/upload',ad=h==='#/admin',ru=h==='#/rules',tu=h==='#/tutorials',ac=h==='#/account',ow=h==='#/owner';
  $('skins').hidden=!!p||up||ad||ru||tu||ac||ow||!!us;$('profile').hidden=!us;$('detail').hidden=!p;$('upload').hidden=!up;$('admin').hidden=!ad;$('rules').hidden=!ru;$('tutorials').hidden=!tu;$('account').hidden=!ac;$('owner').hidden=!ow;
  ad?showAdmin():up?showUpload():ru?showRules():tu?showTutorials():ac?showAccount():ow?showOwner():us?showProfile(us[1]):p?showPack(p):renderList($('q').value);
  window.scrollTo(0,0);
}
$('q').addEventListener('input',e=>renderList(e.target.value));
// tabs just change the address, route() does the rest (so back button and links work)
$('tab-skin').addEventListener('click',()=>{location.hash='#skins'});
$('tab-texture').addEventListener('click',()=>{location.hash='#textures'});
window.addEventListener('hashchange',route);
function loadPacks(quiet){
  return Promise.all([
    fetch('packs.json',{cache:'no-cache'}).then(r=>r.json()),
    fetch('/api/packs',{cache:'no-store'}).then(r=>r.ok?r.json():[]).catch(()=>[])
  ]).then(([a,b])=>{
    packs=a.concat(b);
    // on a normal refresh keep the scroll spot, dont jump to the top
    if(quiet&&(location.hash===''||location.hash==='#skins'||location.hash==='#textures'))renderList($('q').value);else route();
  }).catch(()=>{$('grid').textContent="Couldn't load the pack list. If you opened this file directly, try the live site instead."});
}
loadPacks();
$('refresh').addEventListener('click',()=>{
  const b=$('refresh');b.textContent='Refreshing...';
  loadPacks(true).then(()=>{b.textContent='Refreshed!';setTimeout(()=>{b.textContent='Refresh'},1500)});
});

/* ---------- log in / sign up popup ---------- */
function showAuth(mode){
  const signup=mode==='signup';
  const esc=e=>{if(e.key==='Escape')close()};
  const close=()=>{ov.remove();document.removeEventListener('keydown',esc)};
  const user=el('input',{type:'text',maxlength:'20',autocomplete:'username','aria-label':'Username'});
  const pass=el('input',{type:'password',maxlength:'128',autocomplete:signup?'new-password':'current-password','aria-label':'Password'});
  const pass2=signup?el('input',{type:'password',maxlength:'128',autocomplete:'new-password','aria-label':'Repeat password'}):null;
  const tsBox=signup?el('div',{id:'auth-ts'}):null;
  const human=signup?mountTurnstile(tsBox):null;
  const msg=el('p',{class:'msg',role:'status'});
  const go=el('button',{class:'btn',type:'button',text:signup?'Create account':'Log in'});
  const cancel=el('button',{class:'btn',type:'button',text:'Cancel'});
  const swap=el('button',{class:'btn',type:'button',text:signup?'I already have an account':'I need an account'});
  const bad=t=>{msg.className='msg err';msg.textContent=t};
  async function submit(){
    msg.className='msg';msg.textContent='';
    if(!user.value.trim()||!pass.value)return bad('Enter a username and password.');
    if(signup&&pass.value!==pass2.value)return bad('The two passwords do not match.');
    const headers={'Content-Type':'application/json'};
    if(signup){
      const t=human.token();
      if(!t)return bad('Please finish the human check first.');
      headers['X-Turnstile-Token']=t;
    }
    go.disabled=true;msg.textContent='One moment...';
    try{
      const r=await fetch(signup?'/api/signup':'/api/login',{method:'POST',headers,body:JSON.stringify({username:user.value.trim(),password:pass.value})});
      const d=await r.json().catch(()=>({}));
      if(r.ok&&d.ok){location.reload();return}
      bad(d.error||'That did not work.');
    }catch{bad('Network problem. Try again.')}
    if(signup)human.reset();   // token only works once
    go.disabled=false;
  }
  go.addEventListener('click',submit);
  [user,pass,pass2].forEach(i=>i&&i.addEventListener('keydown',e=>{if(e.key==='Enter')submit()}));
  cancel.addEventListener('click',()=>close());
  swap.addEventListener('click',()=>{close();showAuth(signup?'login':'signup')});
  const ov=el('div',{class:'modal'},
    el('div',{class:'panel',role:'dialog','aria-modal':'true','aria-labelledby':'auth-title'},
      el('h2',{id:'auth-title',text:signup?'Create an account':'Log in'}),
      signup?el('p',{class:'hint',text:'Pick a username (3 to 20 letters, numbers or underscores) and a password with at least 10 characters. No email needed. If you forget your password, ask an admin on our Discord for a temporary one. Use a password you do not use anywhere else.'}):null,
      el('label',{text:'Username'}),user,
      el('label',{text:'Password'}),pass,
      signup?el('label',{text:'Repeat password'}):null,pass2,
      tsBox,msg,
      el('div',{class:'dl'},go,cancel),
      el('div',{class:'dl'},swap)));
  ov.addEventListener('click',e=>{if(e.target===ov)close()});
  document.addEventListener('keydown',esc);
  document.body.append(ov);
  user.focus();
}

/* ---------- top right: log in / sign up, or the account card + log out ----------
   asks the worker whos logged in */
meP.then(me=>{
  const bar=$('acctbar');
  if(!me.loggedIn){
    const li=el('button',{class:'btn',type:'button',text:'Log in'});
    const su=el('button',{class:'btn',type:'button',text:'Sign up'});
    li.addEventListener('click',()=>showAuth('login'));
    su.addEventListener('click',()=>showAuth('signup'));
    bar.append(el('div',{class:'authbtns'},li,su));
    return;
  }
  // account card with my profile picture (or my first letter)
  const initial=()=>el('span',{class:'ph',text:(me.user.name||'?').charAt(0).toUpperCase()});
  let pic=initial();
  if(me.user.hasAvatar){
    const im=el('img',{src:'/files/avatar/'+me.user.name.toLowerCase()+'?v='+(me.user.avatarV||0),alt:''});
    im.addEventListener('error',()=>im.replaceWith(initial()));
    pic=im;
  }
  // logout is a POST so other sites cant trigger it with a link
  const outBtn=el('button',{class:'btn',type:'button',text:'Log out'});
  outBtn.addEventListener('click',async()=>{
    outBtn.disabled=true;
    try{await fetch('/auth/logout',{method:'POST'})}catch{}
    location.href='/';location.reload();
  });
  bar.append(
    el('a',{class:'acct',href:'#/account',title:'My account'},pic,
      el('span',{class:'who'},el('span',{text:me.user.name}),el('small',{text:me.role==='owner'?'Owner':me.role==='admin'?'Admin':me.isMod?'Moderator':'My account'}))),
    outBtn);
  if(me.isMod){
    document.querySelector('.row').append(el('a',{class:'btn',href:'#/admin',text:'Moderation'}));
  }
  if(me.role==='owner'||me.role==='admin'){
    document.querySelector('.row').append(el('a',{class:'btn',href:'#/owner',text:me.role==='owner'?'Owner panel':'Admin panel'}));
  }
}).catch(()=>{});
